<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner glowing circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />

  <!-- Center NutriFit AI emblem: Fork, Knife & Energy Flame -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Central Plate / Ring -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="12" />

    <!-- Flame symbol in center -->
    <path d="M0 -70 C30 -20, 60 10, 45 55 C35 85, -35 85, -45 55 C-60 10, -30 -20, 0 -70 Z" fill="#f59e0b" />
    <path d="M0 -40 C15 -10, 30 15, 20 40 C15 55, -15 55, -20 40 C-30 15, -15 -10, 0 -40 Z" fill="#fef3c7" />

    <!-- Fork on left -->
    <g transform="translate(-140, -100) scale(1.1)">
      <path d="M20 0 L20 80 C20 105 35 120 50 125 L50 210 A6 6 0 0 0 62 210 L62 125 C77 120 92 105 92 80 L92 0 L82 0 L82 70 C82 82 76 90 66 90 L66 0 L56 0 L56 90 C46 90 40 82 40 70 L40 0 Z" fill="#ffffff" />
    </g>

    <!-- Knife on right -->
    <g transform="translate(50, -100) scale(1.1)">
      <path d="M45 0 C45 0 25 35 25 90 C25 115 35 125 45 130 L45 210 A6 6 0 0 0 57 210 L57 0 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- AI Badge -->
  <rect x="196" y="380" width="120" height="44" rx="22" fill="#ffffff" />
  <text x="256" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="2">AI</text>
</svg>
